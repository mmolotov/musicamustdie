version: 2
updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Let a release settle before proposing an update (supply-chain safety).
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    # TypeScript 7 is the new native compiler; defer its major until
    # typescript-eslint (peer "typescript <6.1.0") supports it.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
    # Batch minor/patch bumps into two PRs to cut noise; majors stay separate.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  # GitHub Actions used in workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # Workflows pin floating major tags (e.g. @v7), which already pick up
    # minor/patch releases; only surface new majors here.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-minor, version-update:semver-patch]
    groups:
      actions:
        patterns: ['*']
